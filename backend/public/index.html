<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>IBVAP — Live Detection & Zone Editor</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --border: #24303d;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.3px; }
  #connStatus {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  #connStatus.connected { color: var(--accent); border-color: var(--accent); }
  #connStatus.disconnected { color: var(--danger); border-color: var(--danger); }

  .grid {
    display: flex;
    gap: 14px;
    padding: 16px;
    align-items: flex-start;
  }
  .hero-column { flex: 2.3; min-width: 0; }
  .thumb-column {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tile.is-hero {
    border-color: #3fb950;
    box-shadow: 0 0 0 1px rgba(63, 185, 80, 0.3), 0 8px 28px rgba(0, 0, 0, 0.45);
  }
  .tile.is-hero .tile-header .name { font-size: 15px; }
  .focus-btn {
    background: #1c2530;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 10px;
    cursor: pointer;
    margin-right: 8px;
  }
  .focus-btn:hover { background: var(--blue); color: #0b0f14; border-color: var(--blue); }
  .focus-btn.is-main {
    background: var(--accent);
    color: #0b0f14;
    border-color: var(--accent);
    cursor: default;
    font-weight: 700;
  }
  @media (max-width: 900px) {
    .grid { flex-direction: column; }
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .tile-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .tile-header .name { font-weight: 600; }
  .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.online { color: var(--accent); border-color: var(--accent); }
  .badge.offline { color: var(--danger); border-color: var(--danger); }

  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    cursor: default;
  }
  canvas.drawing { cursor: crosshair; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    align-items: center;
  }
  .toolbar select, .toolbar input[type="text"] {
    background: #0d1117;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 6px;
    font-size: 11px;
  }
  .toolbar input[type="text"] { width: 90px; }
  button.tbtn {
    background: #1c2530;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  button.tbtn:hover { background: #232f3d; }
  button.tbtn.save { background: var(--accent); border-color: var(--accent); color: #0b0f14; font-weight: 600; }
  button.tbtn.danger { background: var(--danger); border-color: var(--danger); color: #0b0f14; font-weight: 600; }
  button.tbtn:disabled { opacity: 0.4; cursor: not-allowed; }

  .meta-row {
    padding: 4px 12px 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .zonelist { padding: 0 12px 10px; font-size: 11px; }
  .zone-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
  }
  .zone-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .zone-chip button {
    background: none; border: none; color: var(--danger); cursor: pointer; font-size: 12px; padding: 0;
  }

  .eventlog {
    margin: 0 16px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 12px;
  }
  .eventlog h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .event-row { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .event-row:last-child { border-bottom: none; }
  .sev-INFO { color: var(--muted); }
  .sev-LOW { color: var(--blue); }
  .sev-MEDIUM { color: var(--warn); }
  .sev-HIGH, .sev-CRITICAL { color: var(--danger); font-weight: 600; }

  .hint {
    padding: 6px 12px;
    font-size: 11px;
    color: var(--warn);
    display: none;
  }
  .hint.show { display: block; }

  /* Virtual fence crossing HUD banner — prominent on-video overlay */
  .crossing-hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #0b0f14;
    background: #f85149;
    box-shadow: 0 4px 18px rgba(248, 81, 73, 0.55);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 5;
  }
  .crossing-hud.show {
    opacity: 1;
    transform: translateY(0);
  }
  .crossing-hud.info {
    background: #58a6ff;
    box-shadow: 0 4px 18px rgba(88, 166, 255, 0.5);
  }
  .crossing-hud .hud-sub {
    display: block;
    font-weight: 400;
    font-size: 11px;
    margin-top: 2px;
    opacity: 0.9;
  }
</style>
</head>
<body>

<header>
  <h1>IBVAP — Live Detection &amp; Zone Editor</h1>
  <div id="connStatus" class="disconnected">Disconnected</div>
</header>

<div class="grid" id="grid">
  <div class="hero-column" id="heroColumn"></div>
  <div class="thumb-column" id="thumbColumn"></div>
</div>

<div class="eventlog">
  <h2>Recent Events</h2>
  <div id="events"></div>
</div>

<script>
const CAMERAS = [
  { id: 'CAM-001', label: 'North Gate' },
  { id: 'CAM-002', label: 'East Fence Line' },
  { id: 'CAM-003', label: 'South Patrol Road' },
  { id: 'CAM-004', label: 'West Watchtower' },
];

const CLASS_COLORS = { person: '#3fb950', vehicle: '#58a6ff', animal: '#d29922', other: '#8b98a5' };
const SEVERITY_COLORS = { LOW: '#58a6ff', MEDIUM: '#d29922', HIGH: '#f85149', CRITICAL: '#ff2d55' };
const FLASH_DURATION_MS = 900;

const grid = document.getElementById('grid');
const heroColumn = document.getElementById('heroColumn');
const thumbColumn = document.getElementById('thumbColumn');
const eventsEl = document.getElementById('events');
const connStatusEl = document.getElementById('connStatus');

const tileState = {};
let heroCameraId = CAMERAS[0].id;

function buildTiles() {
  for (const cam of CAMERAS) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = `
      <div class="tile-header">
        <span class="name">
          <button class="focus-btn" id="focus-${cam.id}">Set as Main</button>
          ${cam.label} <span style="color:var(--muted); font-weight:400;">(${cam.id})</span>
        </span>
        <span class="badge offline" id="badge-${cam.id}">OFFLINE</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="canvas-${cam.id}" width="640" height="480"></canvas>
        <div class="placeholder" id="placeholder-${cam.id}">Waiting for frames…</div>
        <div class="crossing-hud" id="hud-${cam.id}"></div>
      </div>
      <div class="hint" id="hint-${cam.id}">Click points on the video to place <span class="hint-mode"></span>. Click "Finish" when done.</div>
      <div class="toolbar">
        <button class="tbtn" id="poly-${cam.id}">+ Polygon Zone</button>
        <button class="tbtn" id="line-${cam.id}">+ Line Fence</button>
        <input type="text" id="name-${cam.id}" placeholder="Zone name" value="Restricted Area">
        <select id="sev-${cam.id}">
          <option value="LOW">LOW</option>
          <option value="MEDIUM" selected>MEDIUM</option>
          <option value="HIGH">HIGH</option>
          <option value="CRITICAL">CRITICAL</option>
        </select>
        <button class="tbtn save" id="finish-${cam.id}" disabled>Finish &amp; Save</button>
        <button class="tbtn danger" id="cancel-${cam.id}" disabled>Cancel</button>
      </div>
      <div class="meta-row" id="meta-${cam.id}">fps: – | tracks: 0</div>
      <div class="meta-row" id="params-${cam.id}" style="padding-top:0; color:var(--blue);">loading detection params…</div>
      <div class="zonelist" id="zonelist-${cam.id}"></div>
    `;
    // Not appended to the DOM yet — layoutTiles() places each tile into
    // either the hero column or the thumbnail column, and re-runs whenever
    // the presenter clicks "Set as Main" on a different camera.

    const canvas = tile.querySelector(`#canvas-${cam.id}`);
    const state = {
      cameraId: cam.id,
      canvas,
      ctx: canvas.getContext('2d'),
      img: new Image(),
      latestTracks: [],
      zones: [],
      flashingZones: new Map(),
      badge: tile.querySelector(`#badge-${cam.id}`),
      meta: tile.querySelector(`#meta-${cam.id}`),
      placeholder: tile.querySelector(`#placeholder-${cam.id}`),
      hint: tile.querySelector(`#hint-${cam.id}`),
      hud: tile.querySelector(`#hud-${cam.id}`),
      zoneListEl: tile.querySelector(`#zonelist-${cam.id}`),
      paramsEl: tile.querySelector(`#params-${cam.id}`),
      frameCount: 0,
      lastFpsTime: performance.now(),
      draw: { active: false, type: null, points: [] },
      finishBtn: tile.querySelector(`#finish-${cam.id}`),
      cancelBtn: tile.querySelector(`#cancel-${cam.id}`),
      polyBtn: tile.querySelector(`#poly-${cam.id}`),
      lineBtn: tile.querySelector(`#line-${cam.id}`),
      nameInput: tile.querySelector(`#name-${cam.id}`),
      sevSelect: tile.querySelector(`#sev-${cam.id}`),
      tileEl: tile,
      focusBtn: tile.querySelector(`#focus-${cam.id}`),
    };
    tileState[cam.id] = state;

    state.polyBtn.addEventListener('click', () => startDrawing(cam.id, 'POLYGON'));
    state.lineBtn.addEventListener('click', () => startDrawing(cam.id, 'LINE'));
    state.finishBtn.addEventListener('click', () => finishDrawing(cam.id));
    state.cancelBtn.addEventListener('click', () => cancelDrawing(cam.id));
    canvas.addEventListener('click', (e) => onCanvasClick(cam.id, e));
    state.focusBtn.addEventListener('click', () => setHeroCamera(cam.id));

    loadZones(cam.id);
    loadDetectionParams(cam.id);
  }

  layoutTiles();
}

/**
 * Places each camera's tile into either the hero column (large, main view)
 * or the thumbnail column (small, stacked), based on `heroCameraId`. Simply
 * re-parents the existing tile DOM nodes rather than rebuilding them —
 * moving a <canvas> element in the DOM preserves its drawn bitmap content
 * in all modern browsers, so the live video doesn't flicker or reset when
 * the presenter swaps which camera is the main view.
 */
function layoutTiles() {
  for (const cam of CAMERAS) {
    const state = tileState[cam.id];
    if (!state) continue;

    const isHero = cam.id === heroCameraId;
    state.tileEl.classList.toggle('is-hero', isHero);
    state.tileEl.classList.toggle('is-thumb', !isHero);

    if (isHero) {
      state.focusBtn.textContent = 'MAIN';
      state.focusBtn.classList.add('is-main');
      heroColumn.appendChild(state.tileEl);
    } else {
      state.focusBtn.textContent = 'Set as Main';
      state.focusBtn.classList.remove('is-main');
      thumbColumn.appendChild(state.tileEl);
    }
  }
}

function setHeroCamera(cameraId) {
  if (cameraId === heroCameraId) return;
  heroCameraId = cameraId;
  layoutTiles();
}

async function loadDetectionParams(cameraId) {
  try {
    const res = await fetch('/api/cameras');
    const data = await res.json();
    const cam = (data.cameras || []).find((c) => c.camera_id === cameraId);
    const state = tileState[cameraId];
    if (!cam || !state) return;
    const conf = cam.confidence_threshold ?? '(default)';
    const iou = cam.iou_threshold ?? '(default)';
    const stride = cam.frame_stride ?? 1;
    const analytics = cam.analytics_frame_interval ?? '(default)';
    state.paramsEl.textContent = `conf: ${conf} | iou: ${iou} | stride: ${stride} | analytics every ${analytics}f`;
  } catch (err) {
    console.error('Failed to load detection params for', cameraId, err);
  }
}

function startDrawing(cameraId, type) {
  const state = tileState[cameraId];
  if (!state.img.naturalWidth) {
    alert('Wait for the live video to load before drawing a zone.');
    return;
  }
  state.draw = { active: true, type, points: [] };
  state.canvas.classList.add('drawing');
  state.finishBtn.disabled = true;
  state.cancelBtn.disabled = false;
  state.hint.classList.add('show');
  state.hint.querySelector('.hint-mode').textContent =
    type === 'POLYGON' ? 'a polygon (3+ points)' : 'a line (2 points)';
}

function cancelDrawing(cameraId) {
  const state = tileState[cameraId];
  state.draw = { active: false, type: null, points: [] };
  state.canvas.classList.remove('drawing');
  state.finishBtn.disabled = true;
  state.cancelBtn.disabled = true;
  state.hint.classList.remove('show');
  drawFrame(cameraId);
}

function onCanvasClick(cameraId, evt) {
  const state = tileState[cameraId];
  if (!state.draw.active) return;

  const rect = state.canvas.getBoundingClientRect();
  const scaleX = state.canvas.width / rect.width;
  const scaleY = state.canvas.height / rect.height;
  const x = (evt.clientX - rect.left) * scaleX;
  const y = (evt.clientY - rect.top) * scaleY;

  state.draw.points.push([Math.round(x), Math.round(y)]);

  const minPoints = state.draw.type === 'POLYGON' ? 3 : 2;
  state.finishBtn.disabled = state.draw.points.length < minPoints;

  drawFrame(cameraId);
}

async function finishDrawing(cameraId) {
  const state = tileState[cameraId];
  const { type, points } = state.draw;
  const minPoints = type === 'POLYGON' ? 3 : 2;
  if (points.length < minPoints) return;

  const zoneName = state.nameInput.value.trim() || 'Unnamed Zone';
  const severity = state.sevSelect.value;

  try {
    const res = await fetch('/api/zones', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cameraId, zoneName, zoneType: type, coordinates: points, severity }),
    });
    const data = await res.json();
    if (!res.ok) {
      alert(`Failed to save zone: ${data.error || res.statusText}`);
      return;
    }
  } catch (err) {
    alert(`Network error saving zone: ${err.message}`);
    return;
  }

  cancelDrawing(cameraId);
  await loadZones(cameraId);
}

async function loadZones(cameraId) {
  try {
    const res = await fetch(`/api/zones?cameraId=${encodeURIComponent(cameraId)}`);
    const data = await res.json();
    tileState[cameraId].zones = data.zones || [];
    renderZoneList(cameraId);
    drawFrame(cameraId);
  } catch (err) {
    console.error('Failed to load zones for', cameraId, err);
  }
}

async function deleteZone(cameraId, zoneId) {
  try {
    await fetch(`/api/zones/${zoneId}`, { method: 'DELETE' });
  } catch (err) {
    console.error('Failed to delete zone', err);
  }
  await loadZones(cameraId);
}

function renderZoneList(cameraId) {
  const state = tileState[cameraId];
  state.zoneListEl.innerHTML = '';
  for (const zone of state.zones) {
    const chip = document.createElement('span');
    chip.className = 'zone-chip';
    const color = SEVERITY_COLORS[zone.severity] || '#8b98a5';
    chip.innerHTML = `<span class="dot" style="background:${color}"></span>${zone.zone_name} (${zone.zone_type})<button title="Delete">✕</button>`;
    chip.querySelector('button').addEventListener('click', () => deleteZone(cameraId, zone.id));
    state.zoneListEl.appendChild(chip);
  }
}

function drawFrame(cameraId) {
  const state = tileState[cameraId];
  if (!state) return;
  const { canvas, ctx, img, latestTracks, zones, draw } = state;

  if (canvas.width !== img.naturalWidth && img.naturalWidth > 0) {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
  }

  if (img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const now = performance.now();

  for (const zone of zones) {
    const color = SEVERITY_COLORS[zone.severity] || '#8b98a5';
    const isFlashing = (state.flashingZones.get(zone.id) || 0) > now;
    const strokeColor = isFlashing ? '#ffffff' : color;
    const lineWidth = isFlashing ? 4 : 2;

    ctx.beginPath();
    zone.coordinates.forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });

    if (zone.zone_type === 'POLYGON') {
      ctx.closePath();
      ctx.fillStyle = isFlashing ? 'rgba(255,255,255,0.25)' : hexToRgba(color, 0.15);
      ctx.fill();
    }

    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = lineWidth;
    ctx.stroke();

    const [lx, ly] = zone.coordinates[0];
    ctx.font = '11px monospace';
    ctx.fillStyle = strokeColor;
    ctx.fillText(zone.zone_name, lx + 4, Math.max(12, ly - 6));
  }

  if (draw.active && draw.points.length > 0) {
    ctx.beginPath();
    draw.points.forEach(([x, y], i) => {
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    for (const [x, y] of draw.points) {
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
  }

  for (const track of latestTracks) {
    const [x1, y1, x2, y2] = track.box;
    const color = CLASS_COLORS[track.group] || CLASS_COLORS.other;

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    const label = `${track.id} ${track.className} ${(track.confidence * 100).toFixed(0)}%`;
    ctx.font = '12px monospace';
    const textWidth = ctx.measureText(label).width;
    ctx.fillStyle = color;
    ctx.fillRect(x1, Math.max(0, y1 - 16), textWidth + 8, 16);
    ctx.fillStyle = '#0b0f14';
    ctx.fillText(label, x1 + 4, Math.max(12, y1 - 4));
  }
}

function hexToRgba(hex, alpha) {
  const bigint = parseInt(hex.replace('#', ''), 16);
  const r = (bigint >> 16) & 255, g = (bigint >> 8) & 255, b = bigint & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function flashZone(cameraId, zoneId) {
  const state = tileState[cameraId];
  if (!state) return;
  state.flashingZones.set(zoneId, performance.now() + FLASH_DURATION_MS);
  setTimeout(() => drawFrame(cameraId), FLASH_DURATION_MS + 50);
}

const HUD_DURATION_MS = 4000;

/**
 * Shows the prominent on-video HUD banner for a virtual fence crossing —
 * this is the "detection visible in video during AI detection" indicator,
 * distinct from (and in addition to) the subtle zone-outline flash. Animal
 * crossings get a calmer blue informational styling instead of red, since
 * they're not security events.
 */
function showCrossingHud(cameraId, { eventType, zoneName, trackId, className, isAnimalEvent }) {
  const state = tileState[cameraId];
  if (!state || !state.hud) return;

  const direction = eventType === 'OUTBOUND_CROSSING' ? 'OUTBOUND' : 'INBOUND';

  if (isAnimalEvent) {
    state.hud.className = 'crossing-hud info show';
    state.hud.innerHTML = `ℹ️ Animal crossing — informational only<span class="hud-sub">${className} · ${zoneName} · ${trackId}</span>`;
  } else {
    state.hud.className = 'crossing-hud show';
    state.hud.innerHTML = `🚨 ${direction} CROSSING DETECTED<span class="hud-sub">${zoneName} · ${trackId} · ${className}</span>`;
  }

  clearTimeout(state.hudTimer);
  state.hudTimer = setTimeout(() => {
    state.hud.classList.remove('show');
  }, HUD_DURATION_MS);
}

function addEventRow(evt) {
  const row = document.createElement('div');
  row.className = 'event-row';
  const sevClass = `sev-${evt.severity || 'INFO'}`;
  row.innerHTML = `
    <span style="color:var(--muted); min-width:150px;">${evt.timestamp || evt.ts || ''}</span>
    <span style="min-width:70px;">${evt.camera_id || evt.cameraId || ''}</span>
    <span class="${sevClass}" style="min-width:170px;">${evt.event_type || evt.eventType || ''}</span>
    <span style="color:var(--muted);">score: ${evt.risk_score ?? evt.riskScore ?? '-'}</span>
  `;
  eventsEl.prepend(row);
  while (eventsEl.children.length > 50) eventsEl.removeChild(eventsEl.lastChild);
}

function connect() {
  const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${protocol}://${window.location.host}/ws/stream`);

  ws.onopen = () => {
    connStatusEl.textContent = 'Connected';
    connStatusEl.className = 'connected';
  };
  ws.onclose = () => {
    connStatusEl.textContent = 'Disconnected — retrying…';
    connStatusEl.className = 'disconnected';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    const { type, payload } = msg;

    if (type === 'FRAME' && payload?.cameraId) {
      const state = tileState[payload.cameraId];
      if (!state) return;
      state.img.onload = () => drawFrame(payload.cameraId);
      state.img.src = `data:image/jpeg;base64,${payload.jpegBase64}`;
      state.placeholder.style.display = 'none';

      state.frameCount += 1;
      const now = performance.now();
      const elapsed = now - state.lastFpsTime;
      if (elapsed >= 2000) {
        const fps = (state.frameCount / (elapsed / 1000)).toFixed(1);
        state.meta.textContent = `fps: ${fps} | tracks: ${state.latestTracks.length} | zones: ${state.zones.length}`;
        state.frameCount = 0;
        state.lastFpsTime = now;
      }
    }

    if (type === 'TELEMETRY' && payload?.cameraId) {
      const state = tileState[payload.cameraId];
      if (!state) return;
      state.latestTracks = payload.tracks || [];
      drawFrame(payload.cameraId);
    }

    if (type === 'CAMERA_STATUS' && payload?.cameraId) {
      const state = tileState[payload.cameraId];
      if (!state) return;
      state.badge.textContent = payload.status;
      state.badge.className = `badge ${payload.status === 'ONLINE' ? 'online' : 'offline'}`;
    }

    if (type === 'INBOUND_CROSSING' || type === 'OUTBOUND_CROSSING') {
      if (payload?.cameraId && payload?.zoneId) {
        flashZone(payload.cameraId, payload.zoneId);
        showCrossingHud(payload.cameraId, {
          eventType: type,
          zoneName: payload.zoneName,
          trackId: payload.trackId,
          className: payload.className,
          isAnimalEvent: payload.isAnimalEvent,
        });
      }
    }

    const ALL_EVENT_TYPES = [
      'EVENT', 'ALERT', 'INBOUND_CROSSING', 'OUTBOUND_CROSSING',
      'ANIMAL_DETECTED', 'LOITERING_DETECTED', 'VEHICLE_CHECKED',
      'PERSON_IDENTIFIED', 'VEHICLE_ALERT_EMAIL', 'BOUNDARY_ALERT_EMAIL',
      // Behavioral analytics
      'RUNNING_DETECTED', 'CRAWLING_DETECTED', 'CLIMBING_DETECTED',
      'CROWD_SURGE', 'OBJECT_LEFT_BEHIND', 'SUSPICIOUS_APPEARANCE',
      // Camera tampering
      'CAMERA_TAMPER_FREEZE', 'CAMERA_TAMPER_DARKNESS',
      'CAMERA_TAMPER_OVEREXPOSURE', 'CAMERA_TAMPER_OBSTRUCTED',
      // Email / alerting
      'GENERIC_ALERT_EMAIL', 'ALERT_ACKNOWLEDGED',
    ];
    if (ALL_EVENT_TYPES.includes(type)) {
      addEventRow(payload);
    }
  };
}

buildTiles();
connect();
</script>
</body>
</html>
